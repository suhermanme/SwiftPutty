# Every automated check (scripts/test-all.sh --clean) on Apple Silicon and
# Intel, so that each architecture's slice of the core is actually run,
# not just built (docs/TESTING.md, risk R-8). Each stage is its own step,
# so a failure or hang shows where it happened.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-all (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version
          cmake --version | head -1
          ninja --version
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: C core and C tests (plain, leaks, ASan+UBSan, TSan)
        timeout-minutes: 60
        run: |
          set -o pipefail
          scripts/test-all.sh --clean --stage core 2>&1 | tee -a test-all.log

      - name: Swift build (package and tests)
        timeout-minutes: 30
        run: |
          set -o pipefail
          scripts/test-all.sh --stage swift-build 2>&1 | tee -a test-all.log

      # `script` gives the tests a pseudo-terminal, so their progress
      # lines are written as they happen (with a pipe they are buffered,
      # and lost if the step times out).
      - name: Swift tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          script -q /dev/null scripts/test-all.sh --stage swift < /dev/null 2>&1 | tee -a test-all.log

      - name: Swift tests (AddressSanitizer)
        timeout-minutes: 20
        run: |
          set -o pipefail
          script -q /dev/null scripts/test-all.sh --stage swift-asan < /dev/null 2>&1 | tee -a test-all.log

      - name: Swift tests (ThreadSanitizer)
        timeout-minutes: 20
        run: |
          set -o pipefail
          script -q /dev/null scripts/test-all.sh --stage swift-tsan < /dev/null 2>&1 | tee -a test-all.log

      - name: App builds (Debug, universal Release)
        timeout-minutes: 30
        run: |
          set -o pipefail
          scripts/test-all.sh --stage app 2>&1 | tee -a test-all.log

      - name: Report failures
        if: failure() || cancelled()
        run: |
          # GitHub shows at most 10 annotations per step, so send two:
          # the failure lines, and the end of the log (both readable
          # through the API without downloading the log).
          # (macOS ships bash 3.2, so encode with awk, not ${//}.)
          annotate() {  # title, text
            local text
            text=$(printf '%s\n' "$2" | tr -d '\r' \
                   | awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }')
            echo "::error title=$1::${text}"
          }
          failures=$(grep -E "CHECK failed|expected .* got|✘|error:|Test +#.*(\*\*\*|Not Run)|ERROR:|SUMMARY:|WARNING: ThreadSanitizer|Assertion|[1-9][0-9]* leaks for" test-all.log \
            | grep -v "spr_get_error_message" | head -60 || true)
          annotate "Failures" "${failures:-(no failure lines matched)}"
          annotate "End of log" "$(tail -80 test-all.log)"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-all-${{ matrix.arch }}
          path: test-all.log
          if-no-files-found: ignore
