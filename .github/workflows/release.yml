name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Build and package ad-hoc-signed universal app
        shell: bash
        run: |
          mkdir -p build
          scripts/package-release.sh "${GITHUB_REF_NAME#v}" 2>&1 | tee build/release-package.log

      - name: Report packaging failure details
        if: failure()
        shell: bash
        run: |
          if [[ ! -f build/release-package.log ]]; then
            exit 0
          fi
          details="$(tail -n 40 build/release-package.log | awk '{
            gsub(/%/, "%25"); gsub(/\r/, "%0D");
            printf "%s%%0A", $0
          }')"
          echo "::error title=Packaging failure output::$details"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/releases/SwiftPutty-${GITHUB_REF_NAME}-macos-universal.zip" \
            "build/releases/SwiftPutty-${GITHUB_REF_NAME}-macos-universal.zip.sha256" \
            --title "SwiftPutty ${GITHUB_REF_NAME#v}" \
            --generate-notes
