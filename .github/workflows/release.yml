name: GitHub release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Build and package ad-hoc-signed universal app
        run: scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/releases/SwiftPutty-${GITHUB_REF_NAME}-macos-universal.zip" \
            "build/releases/SwiftPutty-${GITHUB_REF_NAME}-macos-universal.zip.sha256" \
            --title "SwiftPutty ${GITHUB_REF_NAME#v}" \
            --generate-notes
