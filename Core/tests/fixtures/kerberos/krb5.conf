[libdefaults]
    default_realm = SWIFTPUTTY.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false
    udp_preference_limit = 1

[realms]
    SWIFTPUTTY.TEST = {
        kdc = 127.0.0.1:88
        admin_server = 127.0.0.1
    }

[domain_realm]
    localhost = SWIFTPUTTY.TEST
